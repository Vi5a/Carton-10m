name: Construire l'APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0
  # charset_normalizer : installer la version pure Python (voir buildozer.spec)
  PIP_NO_BINARY: charset-normalizer

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      # La compilation d'OpenCV + SDK + NDK dépasse l'espace disque par défaut :
      # on supprime les outils préinstallés inutiles (comme le fait python-for-android).
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/PyPy" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Mêmes paquets que l'image de référence de python-for-android (Dockerfile officiel)
      - name: Outils de compilation
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ant autoconf automake autopoint ccache cmake g++ gcc git lbzip2 libffi-dev \
            libltdl-dev libtool libssl-dev make patch pkg-config python3-dev unzip zip \
            zlib1g-dev libncurses-dev build-essential lld
          pip install --upgrade pip setuptools wheel
          pip install "buildozer==1.6.0"

      # Cache : SDK, NDK et bibliothèques déjà compilées (OpenCV…). Il est enregistré
      # même si la compilation échoue : les essais suivants prennent ~10 min au lieu d'1 h.
      - name: Récupérer le cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
          restore-keys: |
            buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-

      - name: Compiler l'APK (≈ 1 h la première fois)
        run: |
          # « yes » accepte les licences ; il se termine en « Broken pipe » quand buildozer
          # s'arrête, ce qui est normal : seul le code de retour de buildozer compte.
          # (GitHub exécute les scripts avec « bash -e -o pipefail » : on le désactive ici.)
          set +e +o pipefail
          yes | buildozer -v android debug 2>&1 | tee compilation.log
          code=${PIPESTATUS[1]}
          ls -la bin/ || true
          exit $code

      - name: Enregistrer le cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # En cas d'échec : les dernières lignes du journal s'affichent sur la page
      # de résumé de la compilation (facile à copier depuis le téléphone).
      - name: Résumé de l'erreur
        if: failure()
        run: |
          # 1) les lignes d'erreur apparaissent dans « Annotations », en haut de la page
          python3 - <<'PY'
          import re
          try:
              lignes = open("compilation.log", errors="replace").read().splitlines()
          except OSError:
              lignes = ["pas de journal"]
          ansi = re.compile(r"\x1b\[[0-9;]*m")
          lignes = [ansi.sub("", l).rstrip() for l in lignes]
          motif = re.compile(r"error|erreur|failed|exception|no space|not found|cannot|undefined", re.I)
          bruit = re.compile(r"^#\s|ENVIRONMENT|Buildozer failed|might be hidden|bug report|log_level", re.I)
          idx = [i for i, l in enumerate(lignes) if motif.search(l) and not bruit.search(l)]
          # première vraie erreur : c'est en général la cause
          blocs = []
          for i in idx[:3] + idx[-6:]:
              bloc = lignes[max(0, i - 6): i + 4]
              if bloc not in blocs:
                  blocs.append(bloc)
          def ann(titre, texte):
              texte = texte[-3500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={titre}::{texte}")
          for k, bloc in enumerate(blocs[:8], 1):
              ann(f"Erreur {k}", "\n".join(bloc))
          ann("Fin du journal", "\n".join(lignes[-25:]))
          PY
          # 2) le même extrait, plus long, dans le résumé en bas de page
          {
            echo "## La compilation a échoué – dernières lignes du journal"
            echo '```'
            grep -n -i -E "error|erreur|failed|exception|no space" compilation.log | tail -n 40 || true
            echo '-----'
            tail -n 80 compilation.log || echo "pas de journal"
            echo '```'
            df -h /
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Journal complet (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: journal-compilation
          path: compilation.log
          if-no-files-found: ignore

      - name: Renommer l'APK
        run: |
          mkdir -p sortie
          cp "$(ls -t bin/*.apk | head -1)" "sortie/AnalyseCartons-${{ github.run_number }}.apk"
          ls -la sortie

      - name: Fichier téléchargeable (onglet Actions)
        uses: actions/upload-artifact@v7
        with:
          name: AnalyseCartons-apk
          path: sortie/*.apk

      - name: Publication (onglet Releases, téléchargeable depuis le téléphone)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-${{ github.run_number }}
          name: Analyse Cartons – version ${{ github.run_number }}
          body: APK à installer sur le téléphone Android (autoriser l'installation depuis cette source).
          files: sortie/*.apk
